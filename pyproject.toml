[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drill-reliable-retrieval"
version = "0.1.0"
description = "Reproducible Vietnamese legal information retrieval research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15",
    "PyYAML>=6",
]

[project.scripts]
drill-validate = "drill_ir.cli:validate_main"
drill-run = "drill_ir.cli:run_main"
drill-package-submission = "drill_ir.cli:submission_main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
