[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drill-reliable-retrieval"
version = "0.1.0"
description = "Reproducible Vietnamese legal information retrieval research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.2.14,<0.3",
    "numpy>=1.26",
    "pyarrow>=15",
    "PyYAML>=6",
]

[project.scripts]
drill-validate = "drill_ir.cli:validate_main"
drill-run = "drill_ir.cli:run_main"
drill-package-submission = "drill_ir.cli:submission_main"

[project.optional-dependencies]
dev = ["pytest>=8"]
dense = [
    "faiss-cpu>=1.8,<2",
    "sentence-transformers>=5.0",
    "torch>=2.1",
    "transformers>=4.41",
]
vietnamese = [
    "pyvi>=0.1.1",
    "vncorenlp>=1.0.3",
]
ltr = [
    "lightgbm>=4.5,<5",
    "scikit-learn>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
