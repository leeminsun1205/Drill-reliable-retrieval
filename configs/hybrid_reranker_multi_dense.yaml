experiment_name: hybrid_bge_m3_plus_challenger_wrrf20_seed42
method: hybrid_reranker
seed: 42

data:
  corpus_path: data/legal-corpus.parquet
  train_path: data/train.parquet
  dev_fraction: 0.2

retrieval:
  top_k: 100
  output_k: 3
  hybrid:
    fusion: weighted_rrf
    rrf_k: 20
    sparse_weight: 0.2
    sparse_top_k: 100
    dense_top_k: 100
    include_zero_score_sparse: false
    dense_components:
      - name: bge_m3
        profile: bge_m3
        weight: 0.4
        top_k: 100
      - name: challenger
        profile: challenger
        weight: 0.4
        top_k: 100
  bm25:
    variant: bm25
    delta: 1.0
    k1: 1.2
    b: 0.75
    min_document_frequency: 1
    max_document_frequency: null
    max_document_frequency_ratio: 1.0
    feedback:
      enabled: false
      method: rm3
      feedback_documents: 5
      feedback_terms: 10
      original_query_weight: 0.7
      dirichlet_mu: 1000.0
    preprocessing:
      normalization:
        unicode_form: NFKC
        lowercase: true
        normalize_whitespace: true
        strip_control_characters: true
      tokenizer:
        word_segmenter: none
        vncorenlp_jar_path: null
        segmenter_max_characters: 20000
        stopword_preset: none
  dense:
    feedback:
      enabled: false
      method: rocchio
      feedback_documents: 5
      alpha: 1.0
      beta: 0.25
      gamma: 0.0
      negative_documents: 0
      candidate_depth: 20
    chunking:
      method: khoan_diem
      max_tokens: 448
      overlap_tokens: 64
      minimum_fill_ratio: 0.5
      aggregation: max
      # Freeze chunk boundaries across dense models for a controlled comparison.
      tokenizer_model_name: BAAI/bge-m3
      tokenizer_revision: null
      tokenizer_document_prefix: ""
      tokenizer_trust_remote_code: false
    encoder:
      backend: sentence_transformers
      model_name: BAAI/bge-m3
      revision: null
      query_prefix: ""
      document_prefix: ""
      max_seq_length: 512
      batch_size: 4
      normalize_embeddings: false
      trust_remote_code: false
    search:
      backend: exact
      metric: cosine
      query_batch_size: 64
    cache:
      enabled: true
      directory: embeddings/shared_default
  dense_profiles:
    bge_m3:
      encoder:
        model_name: BAAI/bge-m3
        query_prefix: ""
        document_prefix: ""
      cache:
        directory: embeddings/bge_m3_khoan_diem448
    challenger:
      encoder:
        model_name: mainguyen9/vietlegal-e5
        query_prefix: "query: "
        document_prefix: "passage: "
      cache:
        directory: embeddings/vietlegal_e5_khoan_diem448

reranking:
  enabled: true
  candidate_source: retrieved_chunks
  retrieved_chunk_depth: 100
  backend: hf_sequence_classification
  model_name: BAAI/bge-reranker-v2-m3
  revision: null
  candidate_pool_size: 50
  representation: khoan_diem
  document_max_tokens: 448
  overlap_tokens: 64
  max_length: 512
  batch_size: 8
  positive_label_index: 1
  trust_remote_code: false
  fp16: true

evaluation:
  output_k_values: [1, 2, 3, 4, 5]
  threshold_sweep:
    enabled: true
    fallback_k_values: [1, 2]
  recall_at_k: [1, 5, 10, 20, 50, 100]

runtime:
  accelerator: auto
  devices: auto
  mixed_precision: false

output:
  root_dir: results
