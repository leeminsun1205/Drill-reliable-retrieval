experiment_name: hybrid_harrier_plus_e5_large_wrrf20_seed42
method: hybrid_reranker
seed: 42

data:
  corpus_path: data/legal-corpus.parquet
  train_path: data/train.parquet
  dev_fraction: 0.2

retrieval:
  top_k: 100
  output_k: 3
  hybrid:
    fusion: weighted_rrf
    rrf_k: 20
    sparse_weight: 0.1
    sparse_top_k: 100
    dense_top_k: 100
    include_zero_score_sparse: false
    dense_components:
      - name: vietlegal_harrier
        profile: vietlegal_harrier
        weight: 0.5
        top_k: 100
      - name: multilingual_e5_large
        profile: multilingual_e5_large
        weight: 0.4
        top_k: 100
  bm25:
    backend: bm25s
    variant: bm25
    delta: 1.0
    k1: 1.2
    b: 0.75
    min_document_frequency: 1
    max_document_frequency: null
    max_document_frequency_ratio: 1.0
    cache:
      enabled: true
      require_hit: false
      directory: indexes/bm25s_vncorenlp
    feedback:
      enabled: false
      method: rm3
      feedback_documents: 5
      feedback_terms: 10
      original_query_weight: 0.7
      dirichlet_mu: 1000.0
    preprocessing:
      normalization:
        unicode_form: NFKC
        lowercase: true
        normalize_whitespace: true
        strip_control_characters: true
      tokenizer:
        word_segmenter: none
        vncorenlp_jar_path: null
        segmenter_max_characters: 20000
        stopword_preset: none
  dense:
    chunk_cache:
      enabled: true
      directory: embeddings/shared_bge_m3_khoan_diem448_chunks
    feedback:
      enabled: false
      method: rocchio
      feedback_documents: 5
      alpha: 1.0
      beta: 0.25
      gamma: 0.0
      negative_documents: 0
      candidate_depth: 20
    chunking:
      method: khoan_diem
      max_tokens: 448
      overlap_tokens: 64
      minimum_fill_ratio: 0.5
      aggregation: max
      # Freeze chunk boundaries across dense models for a controlled comparison.
      tokenizer_model_name: BAAI/bge-m3
      tokenizer_revision: null
      tokenizer_document_prefix: ""
      tokenizer_trust_remote_code: false
    encoder:
      backend: sentence_transformers
      model_name: BAAI/bge-m3
      revision: null
      query_prefix: ""
      document_prefix: ""
      max_seq_length: 512
      batch_size: 4
      normalize_embeddings: false
      trust_remote_code: false
    search:
      backend: faiss_flat
      metric: cosine
      device: cpu
      query_batch_size: 64
    cache:
      enabled: true
      require_hit: false
      directory: embeddings/shared_default
  dense_profiles:
    vietlegal_harrier:
      encoder:
        model_name: mainguyen9/vietlegal-harrier-0.6b
        query_prefix: "Instruct: Given a Vietnamese legal question, retrieve relevant legal passages that answer the question\nQuery: "
        document_prefix: ""
        trust_remote_code: true
      cache:
        directory: embeddings/vietlegal_harrier_0_6b_khoan_diem448
    multilingual_e5_large:
      encoder:
        model_name: intfloat/multilingual-e5-large
        query_prefix: "query: "
        document_prefix: "passage: "
        trust_remote_code: false
      cache:
        directory: embeddings/multilingual_e5_large_khoan_diem448

reranking:
  enabled: true
  batching: global_stream
  outer_pair_batch_size: 1024
  candidate_source: retrieved_chunks
  retrieved_chunk_depth: 100
  backend: hf_sequence_classification
  model_name: BAAI/bge-reranker-v2-m3
  revision: null
  candidate_pool_size: 50
  representation: khoan_diem
  document_max_tokens: 448
  overlap_tokens: 64
  max_length: 512
  # End-to-end T4x2 verification target after the shared retrieval resource
  # barrier. The lifecycle trace must show both devices reclaimed before load.
  batch_size: 64
  positive_label_index: 1
  trust_remote_code: false
  fp16: true

evaluation:
  output_k_values: [1, 2, 3, 4, 5]
  threshold_sweep:
    enabled: true
    fallback_k_values: [1, 2]
  recall_at_k: [1, 5, 10, 20, 50, 100]

runtime:
  accelerator: auto
  devices: auto
  mixed_precision: false

output:
  root_dir: results
