experiment_name: bm25_seed42_k3
method: bm25
seed: 42

data:
  corpus_path: data/legal-corpus.parquet
  train_path: data/train.parquet
  dev_fraction: 0.2

retrieval:
  top_k: 100
  # Selected on the persisted seed-42 dev split from a k sweep, not private test.
  output_k: 3
  bm25:
    k1: 1.2
    b: 0.75
    # Document-frequency vocabulary pruning; disabled by these defaults.
    min_document_frequency: 1
    max_document_frequency: null
    max_document_frequency_ratio: 1.0
    preprocessing:
      normalization:
        unicode_form: NFKC       # null, NFC, or NFKC
        lowercase: true
        normalize_whitespace: true
        strip_control_characters: true
        strip_accents: false     # keep Vietnamese diacritics by default
      tokenizer:
        backend: regex_words     # regex_words, whitespace, character_ngram
        word_segmenter: none     # none, underthesea, pyvi, vncorenlp
        vncorenlp_jar_path: null # required only for word_segmenter=vncorenlp
        # Bounds legacy VnCoreNLP HTTP-form requests; not retrieval chunking.
        segmenter_max_characters: 20000
        min_token_length: 1
        keep_numbers: true       # legal article numbers are often informative
        # none, vi_legal_conservative, or vi_legacy
        stopword_preset: none
        stopwords: []            # removal is opt-in and must be documented
        stopwords_path: null
        character_ngram_min: 3
        character_ngram_max: 5

evaluation:
  # Candidate-stage diagnostics; these do not change the official final metrics.
  recall_at_k: [1, 5, 10, 20, 50, 100]

output:
  root_dir: results
