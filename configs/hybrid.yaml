experiment_name: hybrid_bm25_e5_diem_wrrf_seed42
method: hybrid
seed: 42

data:
  corpus_path: data/legal-corpus.parquet
  train_path: data/train.parquet
  dev_fraction: 0.2

retrieval:
  top_k: 100
  output_k: 3
  hybrid:
    fusion: weighted_rrf
    rrf_k: 60
    sparse_weight: 1.0
    dense_weight: 1.0
    sparse_top_k: 100
    dense_top_k: 100
    # BM25 fills its standalone ranking with score-0 aids for fixed-depth audits;
    # those arbitrary fillers must not receive an RRF contribution.
    include_zero_score_sparse: false
  bm25:
    k1: 1.2
    b: 0.75
    min_document_frequency: 1
    max_document_frequency: null
    max_document_frequency_ratio: 1.0
    preprocessing:
      normalization:
        unicode_form: NFKC
        lowercase: true
        normalize_whitespace: true
        strip_control_characters: true
      tokenizer:
        word_segmenter: none
        vncorenlp_jar_path: null
        segmenter_max_characters: 20000
        stopword_preset: none
  dense:
    chunking:
      method: diem
      max_tokens: 512
      overlap_tokens: 64
      minimum_fill_ratio: 0.5
      aggregation: max
    encoder:
      backend: sentence_transformers
      model_name: intfloat/multilingual-e5-base
      revision: null
      query_prefix: "query: "
      document_prefix: "passage: "
      max_seq_length: 512
      batch_size: 64
      normalize_embeddings: false
      trust_remote_code: false
    search:
      backend: exact
      metric: cosine
      query_batch_size: 64
    cache:
      enabled: true
      directory: embeddings

evaluation:
  recall_at_k: [1, 5, 10, 20, 50, 100]

runtime:
  accelerator: auto
  devices: auto
  mixed_precision: false

output:
  root_dir: results
